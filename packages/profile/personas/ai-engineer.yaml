id: ai-engineer
label: AI Engineer
extends: default

headline: 'AI/LLM Engineer | LangChain, RAG & Agent Orchestration | NestJS, Node.js, TypeScript | Azure'

summary: >-
  Senior Software Engineer specializing in AI-powered platforms, with
  hands-on experience designing agent orchestration layers using NestJS,
  LangChain, and the OpenAI API. Implemented Retrieval-Augmented Generation
  (RAG) and function calling to interpret user intent and execute actions
  against internal and third-party systems, replacing manual multi-platform
  workflows with a single conversational interface. Built a context
  engineering service in .NET 8 to support the RAG pipeline, managing
  context retrieval across repeated, interrupted, and asynchronous
  conversational requests. Delivered framework-specific SDKs (React,
  Angular, Vue) exposing a floating chatbot widget with Active
  Directory-backed authentication for internal, second-party, and external
  integrations. Brings 10+ years of full-stack engineering experience in
  Node.js, TypeScript, and cloud-native architectures (Azure, AWS) as the
  foundation for reliable, production-grade AI systems.

