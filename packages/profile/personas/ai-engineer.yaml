id: ai-engineer
label: AI Engineer
extends: default

headline: >-
  AI Engineer | 11 Years Full-Stack & Cloud-Native to LLM Production
  Systems | RAG, Agent Orchestration, Context Engineering | NestJS,
  LangChain, Node.js, TypeScript

summary: >-
  Senior AI Engineer with 11 years of production software engineering —
  the last 2 years building enterprise LLM systems, the preceding 9
  building the full-stack, cloud-native, and workflow orchestration
  foundation that makes production AI reliable.

  At PwC, designed and built an AI agent orchestration layer using
  NestJS, LangChain, and the OpenAI API — implementing RAG with a
  dedicated context engineering service, function calling for
  multi-system action execution, and cross-framework SDKs (React,
  Angular, Vue) with Active Directory authentication. The platform
  replaced manual multi-platform HR workflows with a single
  conversational interface.

  At Globant, led backend teams building NestJS services handling 50K+
  daily API requests, implemented workflow orchestration with AWS Step
  Functions across distributed services, and championed enterprise AI
  adoption when LLM usage was organizationally discouraged —
  contributing to AI readiness assessments covering governance, prompt
  safety, and cost control. Earlier, at EPAM Systems, co-designed cloud
  modernization strategies using AWS Lambda and Step Functions for a
  Fortune 500 pharmaceutical client recovering from a catastrophic
  ransomware attack.

  The through-line: progressively deeper systems — from full-stack
  Node.js and TypeScript applications, through serverless cloud
  architectures on AWS and Azure, to workflow state machines, to
  LLM-powered agent orchestration. Each stage required the previous
  one. Production AI systems demand the same engineering discipline as
  any high-traffic backend: observability, fault tolerance, cost
  control, and security-first design.

