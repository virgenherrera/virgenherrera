extends: default

headline: >-
  Senior Software Engineer | TypeScript, Node.js, NestJS, Angular | AI
  Engineering: RAG, LangChain, Agent Orchestration | AWS & Azure Cloud |
  11+ Years Full-Stack to Production LLM Systems

summary: >-
  I build production software systems — from full-stack web platforms to
  enterprise LLM agent orchestration — for companies that need reliable
  engineering, not demos. 11+ years shipping TypeScript and Node.js
  systems for PwC, Globant, and enterprise clients across banking,
  healthcare, and industrial IoT.

  • Led a backend team of 4-6 engineers at Globant building NestJS +
  GraphQL services handling 50K+ daily API requests, with SDKs (Angular,
  React, Vue) adopted by 10+ third-party integrators.

  • Designed and built an AI agent orchestration platform at PwC using
  NestJS, LangChain, and the OpenAI API — RAG, function calling, and a
  dedicated context engineering service — replacing manual multi-platform
  HR workflows with one conversational interface.

  • Built a fullstack Industrial IoT / SCADA monitoring platform with a
  RAG reporting chatbot and 4 framework-specific SDKs (React, Angular,
  Vue, Svelte) for a multinational energy consortium.

  • Implemented AWS Step Functions state machines replacing manual
  sequential workflows across 3 distributed services, and championed
  enterprise AI adoption before it was organizationally encouraged.

  • Migrated core banking services from .NET to Java and Golang
  microservices deployed on OpenShift for SPEI interbank payment
  processing at a Mexican financial institution.

  My stack centers on TypeScript, Node.js, and NestJS on the backend,
  Angular and React on the frontend, and AWS/Azure for cloud-native
  deployment — backed by PostgreSQL and MongoDB for data, Playwright and
  Jest for test automation, and Docker/CI-CD pipelines for reliable
  delivery.

  Open to senior and staff engineering roles building production systems
  at the intersection of full-stack engineering and applied AI — let's
  talk.

