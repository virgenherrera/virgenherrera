headline: >-
  Senior Fullstack Engineer | 11+ Years | Angular, React, TypeScript |
  Node.js, NestJS | System Design & Microservices | AI Engineering: RAG,
  LLM Orchestration

summary: >-
  Consulting-forged engineer, not a single-product specialist. 11 years
  inside PwC, Globant, EPAM, and 5 other consulting firms taught me
  something product engineers rarely learn: how to walk into an
  unfamiliar codebase, an unfamiliar industry, and an unfamiliar team,
  then ship production software on a client deadline. Eight industries
  (banking, healthcare, energy, pharma, IoT, insurance, telecom, SaaS)
  and 6 primary stack pivots later, that pattern-matching is the skill I
  bring to every new problem.

  • At PwC, designed and built an AI agent orchestration platform
  (NestJS, LangChain, OpenAI API) with RAG pipelines, function calling,
  and a dedicated context engineering service, replacing manual
  multi-platform HR workflows with one conversational interface across
  enterprise systems.

  • At Globant, led a backend team of 4 to 6 engineers building NestJS +
  GraphQL microservices handling 50K+ daily API requests, with SDKs
  (Angular, React, Vue) adopted by 10+ third-party integrators, applying
  system design principles to support scale and extensibility.

  • Built fullstack Industrial IoT and SCADA monitoring platforms with
  real-time telemetry dashboards, RAG-powered reporting chatbots, and 4
  framework-specific SDKs (React, Angular, Vue, Svelte) for enterprise
  clients in energy and cloud infrastructure.

  • Led enterprise platform modernization across financial services and
  healthcare: Angular frontend rebuilds, .NET to Java/Golang backend
  migrations on Kubernetes (OpenShift), SQL-backed SPEI interbank
  payment processing with strict audit trails, and Agile delivery across
  distributed teams.

  My stack follows my strengths: frontend architecture (Angular, React,
  TypeScript) first, backend systems (Node.js, NestJS, PostgreSQL,
  MongoDB) second, AI engineering (RAG, LLM orchestration, context
  engineering) as the active growth vector, and cloud infrastructure
  (AWS, Azure, Docker, Kubernetes) underneath. Unit testing with Jest,
  E2E automation with Playwright, and CI/CD pipelines are
  non-negotiable on every project.

  Open to senior and staff engineering roles where fullstack depth meets
  applied AI. If your team needs someone who can own system design
  across the stack and ship, let's talk.

