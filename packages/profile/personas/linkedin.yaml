headline: >-
  Senior Fullstack Engineer | TypeScript, Angular, Node.js, NestJS | AI
  Engineering: RAG, LLM Orchestration, Context Engineering | Clean
  Architecture & Design Systems | 11+ Years to Production

summary: >-
  I build production software systems, from frontend architecture and
  design systems to AI-powered platforms, for companies that need
  reliable engineering, not demos. 11+ years shipping TypeScript and
  Node.js systems for PwC, Globant, and enterprise clients across
  banking, healthcare, energy, and industrial IoT.

  • Led a backend team of 4-6 engineers at Globant building NestJS +
  GraphQL services handling 50K+ daily API requests, with SDKs (Angular,
  React, Vue) adopted by 10+ third-party integrators.

  • Designed and built an AI agent orchestration platform at PwC using
  NestJS, LangChain, and the OpenAI API (RAG, function calling, and a
  dedicated context engineering service), replacing manual multi-platform
  HR workflows with one conversational interface.

  • Built fullstack Industrial IoT / SCADA monitoring and AI-powered
  infrastructure platforms: real-time telemetry dashboards, RAG
  reporting chatbots, and 4 framework-specific SDKs (React, Angular,
  Vue, Svelte) for enterprise clients in energy and cloud infrastructure.

  • Led enterprise platform modernization across financial services and
  healthcare: Angular frontend rebuilds, .NET to Java/Golang backend
  migrations on OpenShift, and SPEI interbank payment processing with
  strict audit trail requirements.

  My stack centers on TypeScript, Angular, and React on the frontend,
  Node.js and NestJS on the backend, clean architecture and design
  systems for structure, backed by PostgreSQL and MongoDB for data,
  Playwright and Jest for test automation, and Docker/CI-CD pipelines
  for reliable delivery.

  Open to senior and staff engineering roles building production systems
  at the intersection of full-stack engineering and applied AI. Let's
  talk.

