<a
  class="vh-contact-link"
  [href]="url()"
  [attr.target]="targetAttr()"
  [attr.rel]="relAttr()"
  [attr.aria-label]="targetAttr() === '_blank' ? label() + ' (opens in a new window)' : null"
>
  @if (iconName()) {
    <vh-icon [name]="iconName()!" />
  }
  <span class="vh-contact-link__label">{{ label() }}</span>
</a>
